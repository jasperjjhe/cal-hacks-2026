name: Dependency review

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  dependency-review:
    name: dependency-review
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Check out repository without persisting credentials
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false

      # GitHub's native dependency-review action requires Dependency Graph and
      # Advanced Security for private repositories. Keep the native check when
      # the repository is eligible, and use the fail-closed local policy below
      # as the required gate for this private repository.
      - name: Review dependency changes with GitHub
        if: ${{ github.event.repository.visibility != 'private' }}
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          config-file: .github/dependency-review-config.yml

      - name: Set up pinned Node.js without dependency caching
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: frontend/.nvmrc
          package-manager-cache: false

      - name: Enforce lockfile and seven-day release policy before install
        working-directory: frontend
        run: npm run security:dependencies

      - name: Install dependencies without lifecycle scripts
        working-directory: frontend
        run: npm ci --ignore-scripts --audit=false

      - name: Verify npm signatures
        working-directory: frontend
        run: npm audit signatures --json

      - name: Audit dependencies at high severity
        working-directory: frontend
        run: npm audit --audit-level=high
