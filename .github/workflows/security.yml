name: Security

on:
  push:
    branches: [main, dev]
    paths:
      - 'frontend/**'
      - 'security/**'
      - '.github/**'
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  security:
    name: security
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Check out repository without persisting credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up the pinned Node.js toolchain
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: frontend/.nvmrc
          package-manager-cache: false

      - name: Check lockfile, registry, install scripts, blocklist, and 7-day age policy
        working-directory: frontend
        run: npm run security:dependencies

      - name: Test the seven-day boundary rules
        working-directory: frontend
        run: npm run test:security

      - name: Install exact lockfile contents without lifecycle scripts
        working-directory: frontend
        run: npm ci --ignore-scripts --audit=false

      - name: Verify npm signatures and provenance attestations
        working-directory: frontend
        run: npm audit signatures --json

      - name: Audit all runtime and development dependencies
        working-directory: frontend
        run: npm audit --audit-level=high

      - name: Check workflow hardening rules
        run: node frontend/scripts/check-workflows.mjs

      - name: Generate a CycloneDX SBOM for the build record
        working-directory: frontend
        run: npm sbom --sbom-format=cyclonedx > "$RUNNER_TEMP/converge-sbom.json"

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Verify contract export
        working-directory: frontend
        run: npm run contracts:check

      - name: Test buyer boundaries
        working-directory: frontend
        run: npm run test:buyer

      - name: Test seller boundaries
        working-directory: frontend
        run: npm run test:seller

      - name: Test buyer backend transactions and workflows
        working-directory: frontend
        run: npm run test:backend

      - name: Typecheck backend
        working-directory: frontend
        run: npm run typecheck:backend

      - name: Build
        working-directory: frontend
        run: npm run build
